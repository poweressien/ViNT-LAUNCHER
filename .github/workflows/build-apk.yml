name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's ubuntu runners already ship the Android SDK (ANDROID_HOME is set).
      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: |
          set +e
          ./gradlew :app:assembleDebug --console=plain --stacktrace > build.log 2>&1
          code=$?
          set -e
          # Print only what matters: compiler errors (e: ...) and AAPT/KSP errors, so they fit in one copy-paste.
          if [ $code -ne 0 ]; then
            echo "=============== COMPILER ERRORS ==============="
            grep -E "^e: " build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -150
            echo "=============== WHAT WENT WRONG ==============="
            awk '/^FAILURE: Build failed/{f=1} f{print} /^BUILD FAILED/{f=0}' build.log | head -80
            echo "=============== OTHER ERROR LINES ==============="
            grep -iE "error|exception|failed|cannot|unresolved" build.log | grep -v "^\s*at " | sort -u | head -60
            echo "=============== LAST 60 LINES ==============="
            tail -n 60 build.log
            echo "=============== END ERRORS ==============="
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueMimicryLauncher-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload full log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            app/build/reports/
